<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Didact+Gothic&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3ede2;--ink:#1d2433;--card:#fffaf0;--line:#d9cfbd;--board:#2b4a8b;--hole:#f3ede2;--p1:#e8553f;--p2:#f2b705;--go:#2fbf71;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a2b;--ink:#f3ede2;--card:#1f2740;--line:#33405f;--board:#3558a8;--hole:#141a2b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141a2b;--ink:#f3ede2;--card:#1f2740;--line:#33405f;--board:#3558a8;--hole:#141a2b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Century Gothic",CenturyGothic,AppleGothic,"Didact Gothic","Avant Garde",system-ui,sans-serif;line-height:1.4;min-height:100vh}
.wrap{max-width:620px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:clamp(2.6rem,11vw,4.2rem);font-weight:800;letter-spacing:-.04em;line-height:.95;margin:8px 0 6px}
.sub{margin:0 0 20px;opacity:.75;max-width:40ch}
.players{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.pl{border-radius:18px;padding:12px 14px;color:#1d2433;display:flex;flex-direction:column;gap:2px}
.pl.a{background:var(--p1)}.pl.b{background:var(--p2)}
.pl input{font:inherit;font-weight:600;font-size:1.05rem;background:transparent;border:0;border-bottom:2px solid rgba(29,36,51,.35);color:inherit;width:100%;padding:2px 0}
.pl input:focus-visible{outline:3px solid #1d2433;outline-offset:3px;border-radius:4px}
.pl .n{font-size:2.8rem;font-weight:800;line-height:1;letter-spacing:-.03em}
.pl small{opacity:.8}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);padding:5px;border-radius:999px;margin-bottom:22px}
.tabs button{flex:1;font:inherit;font-weight:600;border:0;background:transparent;color:inherit;padding:10px 6px;border-radius:999px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
button:focus-visible{outline:3px solid var(--board);outline-offset:2px}
.status{font-size:1.35rem;font-weight:600;min-height:2.8em;margin:0 0 12px}
.dot{display:inline-block;width:.85em;height:.85em;border-radius:50%;vertical-align:-.05em;margin-right:.35em}
.btn{font:inherit;font-weight:600;margin-top:18px;background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:12px 22px;cursor:pointer}
.rules{margin-top:26px;font-size:.9rem;opacity:.7}
.reset{font:inherit;background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;opacity:.7;padding:0;margin-top:26px}
/* tic-tac-toe */
.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:420px}
.ttt button{aspect-ratio:1;border:0;border-radius:18px;background:var(--card);box-shadow:inset 0 0 0 2px var(--line);font:inherit;font-size:clamp(2.4rem,14vw,4rem);font-weight:800;color:#1d2433;cursor:pointer}
.ttt button.p1{background:var(--p1);box-shadow:none}.ttt button.p2{background:var(--p2);box-shadow:none}
.ttt button.win{outline:5px solid var(--ink);outline-offset:-5px}
/* connect 4 */
.c4{max-width:460px}
.drops,.grid4{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.drops button{font:inherit;font-size:1.1rem;background:transparent;border:0;color:inherit;opacity:.6;cursor:pointer;padding:6px 0}
.drops button:hover{opacity:1}
.grid4{background:var(--board);padding:8px;border-radius:18px}
.grid4 i{aspect-ratio:1;border-radius:50%;background:var(--hole)}
.grid4 i.p1{background:var(--p1)}.grid4 i.p2{background:var(--p2)}
.grid4 i.win{box-shadow:0 0 0 4px var(--ink) inset}
/* reaction */
.pads{display:grid;grid-template-columns:1fr 1fr;gap:12px;border-radius:24px;padding:8px;border:6px solid transparent;transition:border-color .1s}
.pads.go{border-color:var(--go)}
.pad{min-height:240px;border:0;border-radius:18px;font:inherit;color:#1d2433;font-weight:800;font-size:1.5rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:10px}
.pad small{font-weight:400;font-size:.9rem}
.pad.p1{background:var(--p1)}.pad.p2{background:var(--p2)}
body{background-image:radial-gradient(var(--line) 1.5px,transparent 1.5px);background-size:24px 24px}
h1{letter-spacing:-.02em;line-height:1}
.pl .n{letter-spacing:-.01em}
.pl{box-shadow:0 0 0 var(--ink);transition:transform .2s,box-shadow .2s,opacity .2s}
.turns .pl:not(.active){opacity:.6}
.pl.active{transform:translateY(-4px);box-shadow:0 6px 0 var(--ink)}
.tabs{box-shadow:0 4px 0 var(--line)}
.tabs button{transition:background .15s,color .15s}
.tabs button[aria-pressed="false"]:hover{background:var(--bg)}
main#stage{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:22px;box-shadow:0 8px 0 var(--line)}
.status{font-size:1.5rem}
.btn{box-shadow:0 4px 0 color-mix(in srgb,var(--ink) 35%,transparent);transition:transform .1s,box-shadow .1s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(4px);box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.ttt button{transition:background .15s}
.ttt button:not(.p1):not(.p2):hover{background:var(--bg)}
.ttt button.p1,.ttt button.p2{animation:pop .28s ease-out}
.grid4 i{box-shadow:inset 0 4px 0 rgba(0,0,0,.25)}
.grid4 i.p1,.grid4 i.p2{box-shadow:inset 0 -5px 0 rgba(0,0,0,.18);animation:drop .5s cubic-bezier(.4,0,.7,1.3)}
.grid4 i.p1.win,.grid4 i.p2.win{box-shadow:inset 0 0 0 4px var(--ink)}
.pad{box-shadow:0 6px 0 rgba(29,36,51,.35);transition:transform .08s,box-shadow .08s}
.pad:active{transform:translateY(5px);box-shadow:none}
.n.bump{animation:bump .5s ease-out}
.cf{position:fixed;top:-16px;width:10px;height:14px;border-radius:2px;z-index:50;pointer-events:none;animation:fall 1.8s ease-in forwards}
@keyframes pop{0%{transform:scale(.5)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes drop{from{transform:translateY(-450%)}}
@keyframes bump{40%{transform:scale(1.35)}}
@keyframes fall{to{transform:translate(var(--dx),108vh) rotate(var(--r))}}
@media (max-width:420px){main#stage{padding:14px;border-radius:22px}.pad{min-height:200px}}
#again,#go{display:none}
.roundbar{font-weight:600;font-size:1.1rem;margin-bottom:12px;min-height:1.5em}
.pips{display:flex;gap:6px;margin-top:8px}
.pips b{width:14px;height:14px;border-radius:50%;border:2px solid rgba(29,36,51,.5)}
.pips b.on{background:#1d2433;border-color:#1d2433;animation:pop .3s ease-out}
.cf{z-index:100}
.overlay{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background-color:var(--bg);background-image:radial-gradient(var(--line) 1.5px,transparent 1.5px);background-size:24px 24px}
.overlay[hidden]{display:none}
#splash p{margin:0;opacity:.7;font-size:1.1rem}
#splash h2{font-size:clamp(2.4rem,12vw,4.5rem);margin:.2em 0;font-weight:800;letter-spacing:-.02em}
#splash h2.land{animation:land .5s cubic-bezier(.2,1.4,.4,1)}
#winner{background-color:var(--wc);background-image:none;color:#1d2433;overflow:hidden}
#winner::before{content:"";position:absolute;width:160vmax;height:160vmax;left:50%;top:50%;margin:-80vmax 0 0 -80vmax;background:repeating-conic-gradient(rgba(255,255,255,.25) 0 10deg,transparent 10deg 20deg);animation:spin 24s linear infinite}
#winner>*{position:relative}
.trophy{animation:trophyIn .9s cubic-bezier(.2,1.4,.4,1) both,float 2.4s ease-in-out .9s infinite}
#winner h2{font-size:clamp(2.6rem,13vw,5.5rem);margin:.3em 0 0;font-weight:800;line-height:1.05;animation:rise .6s .5s both}
#winner .big{font-size:1.6rem;margin:0;animation:rise .6s .7s both}
#winner .fin{font-size:3rem;font-weight:800;margin:.3em 0 0;animation:rise .6s .9s both}
#winner .btn{background:#1d2433;color:#f3ede2;animation:rise .6s 1.1s backwards}
@keyframes land{from{transform:scale(.4) rotate(-6deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes trophyIn{from{transform:translateY(-120vh) rotate(-30deg) scale(.5)}}
@keyframes float{50%{transform:translateY(-12px) rotate(3deg)}}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}
.rowbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.rowbar .roundbar{margin:0}
.mini{font:inherit;font-weight:600;font-size:.9rem;background:var(--card);color:inherit;border:2px solid var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;box-shadow:0 3px 0 var(--ink);transition:transform .1s,box-shadow .1s;flex:none}
.mini:active{transform:translateY(3px);box-shadow:none}
.mini:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.mini.arm{background:var(--p1);color:#1d2433}
.col{display:flex;flex-direction:column;gap:10px}
.pad.sm{min-height:64px;font-size:1.15rem}
.pn2{font-weight:600;text-align:center;margin-bottom:2px}
.pad:disabled{opacity:.5;cursor:default;box-shadow:none}
.pad.sel:disabled{opacity:1;outline:4px solid var(--ink)}
.cnt{font-size:3.2rem;font-weight:800;line-height:1}
.q{font-size:clamp(2.4rem,12vw,3.6rem);font-weight:800;text-align:center;margin:4px 0 14px}
.glist{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:4px 16px;box-shadow:0 4px 0 var(--line)}
.glist summary{font-weight:600;padding:12px 0;cursor:pointer}
.glist summary:focus-visible{outline:3px solid var(--board);outline-offset:2px;border-radius:6px}
.glist ul{list-style:none;margin:0;padding:0 0 12px;display:grid;gap:8px}
.glist li{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:14px;border:2px solid var(--line)}
.glist li span{font-size:.9rem;opacity:.75}
.glist li.now{border-color:var(--ink);background:var(--bg)}
.glist li.now b::after{content:" (playing now)";font-weight:400;opacity:.7}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.tile{aspect-ratio:1;border-radius:16px;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:2.2rem;color:#fff;opacity:.3;transition:opacity .1s,transform .1s}
.tile.lit{opacity:1;transform:scale(1.08)}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pad.sq{min-height:64px;font-size:1.6rem}
main#stage.mpstage{border:2px solid var(--ink);box-shadow:0 8px 0 var(--ink)}
#splash.mp{background-color:#1d2433;background-image:none;color:#f3ede2}
#splash.mp h2.land{animation:land .5s cubic-bezier(.2,1.4,.4,1),pulse .8s .5s 2}
@keyframes pulse{50%{transform:scale(1.08)}}
.players{grid-template-columns:repeat(var(--cols,2),1fr)}
.players.many .pl{padding:10px}
.players.many .n{font-size:2rem}
.players.many .pips{gap:4px}
.players.many .pips b{width:11px;height:11px}
.players.many .pl input{font-size:.95rem}
.pl.spec{opacity:.5}
#splash #sv{font-weight:600;margin-top:10px;opacity:1;font-size:1.3rem}
#setup h1{margin:0 0 8px}
.chips{display:flex;gap:10px;margin:8px 0 14px}
.chip{font:inherit;font-weight:800;font-size:1.5rem;width:56px;height:56px;border-radius:50%;border:2px solid var(--ink);background:var(--card);color:inherit;cursor:pointer;box-shadow:0 4px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.chip:active{transform:translateY(4px);box-shadow:none}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.setnames{display:grid;gap:8px;width:min(320px,100%);margin:6px 0 12px}
.setnames input{font:inherit;font-weight:600;font-size:1.05rem;padding:10px 14px;border-radius:14px;border:3px solid;background:var(--card);color:inherit}
#winner .btn{margin:14px 6px 0}
#winner .btn.alt{background:transparent;color:#1d2433;border:3px solid #1d2433;box-shadow:none}
.pl.out{opacity:.3;filter:grayscale(1)}
.tog{display:flex;gap:10px;align-items:center;justify-content:center;font-weight:600;margin:4px 0 14px;max-width:34ch;text-align:left}
.tog[hidden]{display:none}
.tog input{width:22px;height:22px;flex:none;accent-color:var(--ink)}
.guest #rg{display:none}
.oi{font:inherit;font-weight:600;font-size:1.05rem;padding:10px 14px;border-radius:14px;border:3px solid var(--ink);background:var(--card);color:inherit;width:min(260px,100%);text-align:center}
#oc{text-transform:uppercase;letter-spacing:.2em;width:130px}
.orow{display:flex;gap:10px;align-items:center;justify-content:center;margin:8px 0;flex-wrap:wrap}
.code{font-size:clamp(3rem,16vw,5rem);font-weight:800;letter-spacing:.12em;margin:6px 0}
.roster{list-style:none;padding:0;margin:6px 0 14px;display:grid;gap:6px;min-width:200px}
.roster li{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:600}
[data-key]::after{content:attr(data-key);display:inline-block;margin-top:6px;min-width:1.7em;padding:.05em .45em;border-radius:7px;border:2px solid currentColor;border-bottom-width:4px;font-size:.85rem;font-weight:700;line-height:1.3;background:rgba(255,255,255,.4);color:inherit;opacity:.85}
.pad[data-key]::after{font-size:1rem}
.pad.sq[data-key]::after{margin-top:2px;font-size:.8rem}
.ttt button[data-key]{position:relative}
.ttt button[data-key]::after{position:absolute;top:8px;left:10px;margin:0;font-size:.75rem;opacity:.6}
.ttt button.p1[data-key]::after,.ttt button.p2[data-key]::after{display:none}
.drops button[data-key]::after{display:block;margin:2px auto 0;background:transparent}
.dice{text-align:center}
.die{font-size:5rem;line-height:1;margin:4px 0 10px}
.pigrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.pgc{background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:8px 4px;font-weight:600;font-size:.9rem}
.pgc b{display:block;font-size:1.8rem;font-weight:800}
.orow .btn.hold{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.sticks{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 2px;margin:8px 0 14px;min-height:64px}
.stk{display:inline-block;width:10px;height:56px;border-radius:5px;background:var(--ink);margin:0 4px}
.trk{margin:8px 0 16px;font-weight:600}
.rail{position:relative;height:22px;border-radius:11px;background:var(--bg);border:2px solid var(--line);margin-top:8px}
.tgt{position:absolute;left:50%;top:-6px;bottom:-6px;width:4px;background:var(--ink);transform:translateX(-50%);border-radius:2px}
.mk{position:absolute;top:-5px;left:50%;width:26px;height:26px;border-radius:50%;transform:translateX(-50%);background:var(--p1);border:3px solid var(--ink)}
#mk1{background:var(--p2)}
.mk.lock{outline:4px solid var(--ink)}
.pad.nt{background:var(--card);box-shadow:inset 0 0 0 2px var(--line);color:var(--ink)}
.pad.nt.t1{border-top:6px solid var(--p1)}
.pad.nt.t2{border-top:6px solid var(--p2)}
#attract{position:fixed;inset:0;z-index:55;overflow:hidden;background:var(--bg);filter:blur(7px) saturate(1.1);transform:scale(1.08);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:4vmin;padding:4vmin;pointer-events:none}
#attract[hidden]{display:none}
.sc{background:var(--card);border:2px solid var(--line);border-radius:28px;padding:3vmin;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;animation:drift 9s ease-in-out infinite alternate;animation-delay:var(--d,0s)}
.sc .ttt,.sc .grid4,.sc .tiles,.sc .sticks,.sc .trk{width:min(100%,300px)}
.sc .sticks{min-height:0}
.sc .stk{height:44px;margin:0 2px}
.sc .die{font-size:min(14vmin,7rem)}
.mk.b{background:var(--p2)}
#setup{background-color:color-mix(in srgb,var(--bg) 62%,transparent);background-image:none;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
@keyframes drift{from{transform:translateY(-1.5vmin) rotate(-.6deg)}to{transform:translateY(1.5vmin) rotate(.6deg)}}
@keyframes slide{from{left:6%}to{left:94%}}
@media (max-width:700px){#attract{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(3,1fr)}}
#mute{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));z-index:70}
.dbx{display:grid;grid-template-columns:14px 1fr 14px 1fr 14px 1fr 14px;grid-template-rows:14px 1fr 14px 1fr 14px 1fr 14px;max-width:340px;aspect-ratio:1;margin:0 auto}
.dt{background:var(--ink);border-radius:50%}
.eg{border:0;border-radius:7px;background:var(--line);cursor:pointer;padding:0;transition:background .1s}
.eg:not(:disabled):hover{background:var(--ink);opacity:.5}
.eg.p1{background:var(--p1)}
.eg.p2{background:var(--p2)}
.bx{border-radius:8px;margin:3px}
.bx.p1{background:var(--p1)}
.bx.p2{background:var(--p2)}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:360px;margin:0 auto}
.card{aspect-ratio:1;border-radius:14px;border:0;font:inherit;font-size:clamp(1.6rem,8vw,2.4rem);font-weight:800;background:var(--ink);color:var(--bg);cursor:pointer;padding:0}
.card.open{background:var(--card);box-shadow:inset 0 0 0 3px var(--line);color:var(--ink);animation:pop .25s ease-out}
.card.p1{background:var(--p1);color:#1d2433;box-shadow:none}
.card.p2{background:var(--p2);color:#1d2433;box-shadow:none}
.card:disabled{cursor:default}
.ech .tile{border:0;font:inherit;font-size:2.2rem;cursor:pointer}
.ech .tile:not(:disabled){opacity:.75}
.ech .tile.lit{opacity:1;transform:scale(1.08)}
.fshow{display:flex;justify-content:center;margin:4px 0 14px}
.fg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:min(100%,170px)}
.fc{aspect-ratio:1;border-radius:10px;background:var(--bg);border:2px solid var(--line)}
.fc.on{background:var(--ink);border-color:var(--ink)}
.pad.sq2{min-height:0;aspect-ratio:1;padding:0;font-size:.9rem;background:var(--card);box-shadow:inset 0 0 0 2px var(--line);color:var(--ink)}
.pad.sq2[data-p="0"].hit{background:var(--p1)}
.pad.sq2[data-p="1"].hit{background:var(--p2)}
.pad.sq2.hit:disabled{opacity:1}
.sq2[data-key]::after{margin:0;font-size:.7rem;min-width:1.4em}
.sc .mem,.sc .dbx{width:min(100%,260px)}
.sc .fg{width:min(100%,200px)}
#attract{display:flex;flex-direction:column;justify-content:center;gap:5vmin;padding:5vmin 0;filter:blur(4px) saturate(1.1);transform:none}
.arow{flex:none}
.track{display:flex;width:max-content;animation:scrollL 40s linear infinite}
.aset{display:flex;gap:5vmin;padding-right:5vmin;flex:none}
.aset .sc{width:clamp(240px,26vw,420px);height:clamp(240px,26vw,420px);flex:none;animation:none}
@keyframes scrollL{to{transform:translateX(-50%)}}
#sfxb{position:fixed;right:calc(max(14px,env(safe-area-inset-right,0px)) + 128px);bottom:max(14px,env(safe-area-inset-bottom,0px));z-index:70}
#accb{position:fixed;left:max(14px,env(safe-area-inset-left,0px));top:max(14px,env(safe-area-inset-top,0px));z-index:70}
#acc{z-index:66;overflow:auto;justify-content:flex-start;padding-top:max(60px,env(safe-area-inset-top,0px));padding-bottom:80px;background-color:var(--bg)}
.avgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;max-width:340px;margin:10px auto}
.avb{font-size:1.6rem;border:2px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer;padding:6px}
.avb[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.bigav{font-size:4.5rem;line-height:1}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;width:min(340px,100%);margin:10px auto}
.st{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.st b{display:block;font-size:1.4rem}

<body>
<div class="wrap">
  <h1>Game night</h1>
  <p class="sub">1 to 5 players, one screen. Every round is a surprise game. First to 5 takes the match.</p>
  <section class="players" id="players"></section>
  <div class="rowbar"><div class="roundbar" id="roundbar" aria-live="polite"></div><button class="mini" id="rg">Restart match</button></div>
  <main id="stage"></main>
  <details class="glist"><summary id="glsum">All games</summary><ul id="gl"></ul></details>
  <details class="glist" id="ydet" hidden><summary id="ysum">Your games</summary><ul id="yl"></ul></details>
  <button class="mini" id="mute">♪ Music on</button>
  <button class="mini" id="sfxb">Sounds on</button>
  <button class="mini" id="accb" hidden>Guest</button>
  <button class="mini" id="helpb" hidden>How to play</button>
  <div id="attract" aria-hidden="true" hidden></div>
  <div class="overlay" id="splash" hidden></div>
  <div class="overlay" id="winner" hidden></div>
  <div class="overlay" id="setup" hidden></div>
  <div class="overlay" id="shop" hidden></div>
  <div class="overlay" id="acc" hidden></div>
  <div class="overlay" id="test" hidden></div>
  <div class="overlay" id="tut" hidden></div>
</div>
<script>
const $=s=>document.querySelector(s), stage=$('#stage');
let names=['Player 1','Player 2','Player 3','Player 4','Player 5'], scores=[0,0];
try{const d=JSON.parse(localStorage.getItem('gamenight')||'null');if(d){names=d.n;scores=d.s}}catch(e){}
const save=()=>{try{localStorage.setItem('gamenight',JSON.stringify({n:names,s:scores}))}catch(e){}};
const nm=i=>names[i].trim()||'Player '+(i+1);
const dot=i=>`<span class="dot" style="background:var(--p${i+1})"></span>`;
const who=i=>dot(i)+nm(seat[i]).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cur,matchOver=false,nextT,introT,winTick,busy=false,tk,seat=[0,1],vsCPU=false,plays=[0,0],bots=[],botIn=false,WIN=5,tour=null;
const PCOL=['#e8553f','#f2b705','#3fbf86','#ef7fb4','#b08be8'];

function drawPlayers(){
  const P=$('#players'),n=scores.length;P.style.setProperty('--cols',n<=3?n:n===4?2:3);P.classList.toggle('many',n>2);P.innerHTML=scores.map((_,i)=>`<div class="pl" style="background:${PCOL[i]}"><span class="avt">${AVS[avs[i]]||''}</span><input aria-label="Player ${i+1} name" maxlength="14" value="" data-i="${i}"><span class="n" id="s${i}">${scores[i]}</span><span class="pips" id="pp${i}">${'<b></b>'.repeat(WIN)}</span></div>`).join('');
  document.querySelectorAll('.pl input').forEach(inp=>{inp.value=names[+inp.dataset.i];if(vsCPU&&inp.dataset.i==='1')inp.readOnly=true;inp.oninput=()=>{names[+inp.dataset.i]=inp.value;save();cur&&cur.refresh()}});
}
function renderScores(){scores.forEach((_,i)=>{$('#s'+i).textContent=scores[i];[...$('#pp'+i).children].forEach((b,k)=>b.classList.toggle('on',k<scores[i]))})}
function addWin(q){if(SBX){sbxWin(q);return}const i=seat[q];scores[i]++;save();renderScores();const s=$('#s'+i);s.classList.remove('bump');void s.offsetWidth;s.classList.add('bump');sfxRound(i);confetti(i);if(scores[i]>=WIN){matchOver=true;clearTimeout(nextT);setTimeout(()=>{if(matchOver)tour?tourWin(i):winScreen(i)},1400)}}
function confetti(i){if(net&&isHost&&started)net.emit('fx',{i}).catch(()=>{});if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;const cols=[PCOL[i],'var(--ink)',PCOL[(i+1)%PCOL.length]];for(let k=0;k<36;k++){const e=document.createElement('i');e.className='cf';e.style.cssText=`left:${Math.random()*100}vw;background:${cols[k%3]};--dx:${(Math.random()-.5)*160}px;--r:${Math.random()*720}deg;animation-delay:${Math.random()*.25}s`;document.body.appendChild(e);setTimeout(()=>e.remove(),2300)}}

/* Tic-tac-toe */
const ttt={get starter(){return Math.random()<.5?1:0},
 mount(){this.b=Array(9).fill(0);this.turn=this.starter;this.res=null;
  stage.innerHTML='<p class="status" id="st" aria-live="polite"></p><div class="ttt" id="g">'+[...Array(9)].map((_,i)=>`<button data-i="${i}" aria-label="Square ${i+1}"></button>`).join('')+'</div><button class="btn" id="again">New round</button><p class="rules">Take turns. Get three in a row to win. Click a square or press 1 to 9.</p>';
  $('#g').onclick=e=>{const b=e.target.closest('button');if(b)this.play(+b.dataset.i)};
  $('#again').onclick=()=>{this.starter^=1;this.mount()};this.refresh()},
 key(e){if(e.repeat)return;const n=+e.key;if(n>=1&&n<=9)this.play(n-1)},
 play(i){if(this.res||this.b[i])return;const p=this.turn,c=$('#g').children[i];this.b[i]=p+1;c.textContent=p?'○':'✕';c.className='p'+(p+1);
  const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]],w=L.find(l=>l.every(k=>this.b[k]===p+1));
  if(w){this.res='win';w.forEach(k=>$('#g').children[k].classList.add('win'));addWin(p)}
  else if(this.b.every(Boolean))this.res='draw';else this.turn^=1;this.refresh()},
 refresh(){$('#st').innerHTML=this.res==='win'?who(this.turn)+' wins!':this.res==='draw'?'It’s a draw.':who(this.turn)+'’s turn'}
};

/* Connect 4 */
const c4={get starter(){return Math.random()<.5?1:0},
 mount(){this.b=Array.from({length:6},()=>Array(7).fill(0));this.turn=this.starter;this.res=null;
  stage.innerHTML='<p class="status" id="st" aria-live="polite"></p><div class="c4"><div class="drops">'+[...Array(7)].map((_,c)=>`<button data-c="${c}" aria-label="Drop in column ${c+1}">▼</button>`).join('')+'</div><div class="grid4" id="g">'+'<i></i>'.repeat(42)+'</div></div><button class="btn" id="again">New round</button><p class="rules">Drop discs. Connect four in any direction to win. Click an arrow or press 1 to 7.</p>';
  document.querySelector('.drops').onclick=e=>{const b=e.target.closest('button');if(b)this.drop(+b.dataset.c)};
  $('#again').onclick=()=>{this.starter^=1;this.mount()};this.refresh()},
 key(e){if(e.repeat)return;const n=+e.key;if(n>=1&&n<=7)this.drop(n-1)},
 drop(c){if(this.res)return;let r=5;while(r>=0&&this.b[r][c])r--;if(r<0)return;const p=this.turn;this.b[r][c]=p+1;$('#g').children[r*7+c].className='p'+(p+1);
  const D=[[0,1],[1,0],[1,1],[1,-1]];
  for(const[dr,dc]of D){const cells=[[r,c]];for(const s of[1,-1]){let y=r+dr*s,x=c+dc*s;while(this.b[y]&&this.b[y][x]===p+1){cells.push([y,x]);y+=dr*s;x+=dc*s}}
   if(cells.length>=4){this.res='win';cells.forEach(([y,x])=>$('#g').children[y*7+x].classList.add('win'));addWin(p);break}}
  if(!this.res){if(this.b[0].every(Boolean))this.res='draw';else this.turn^=1}this.refresh()},
 refresh(){$('#st').innerHTML=this.res==='win'?who(this.turn)+' wins!':this.res==='draw'?'It’s a draw.':who(this.turn)+'’s turn'}
};

/* Reaction duel */
const rx={
 mount(){this.phase='idle';this.msg='Press start, then wait for the green frame.';
  stage.innerHTML='<p class="status" id="st" aria-live="polite"></p><div class="pads" id="pads"><button class="pad p1" data-p="0"><span class="pn"></span><small>click or press</small></button><button class="pad p2" data-p="1"><span class="pn"></span><small>click or press</small></button></div><button class="btn" id="go">Start round</button><p class="rules">When the frame turns green, hit your pad first. Tap early and you lose the round.</p>';
  $('#pads').onclick=e=>{const b=e.target.closest('.pad');if(b)this.hit(+b.dataset.p)};
  $('#go').onclick=()=>this.start();this.refresh()},
 start(){clearTimeout(this.t);this.phase='wait';this.msg='Wait for it…';$('#pads').classList.remove('go');
  this.t=setTimeout(()=>{this.phase='go';this.t0=performance.now();this.msg='Go!';$('#pads').classList.add('go');this.refresh()},1500+Math.random()*3500);this.refresh()},
 hit(p){if(this.phase==='wait'){clearTimeout(this.t);this.phase='done';this.fault=p;this.msg=null;addWin(1-p)}
  else if(this.phase==='go'){const ms=Math.round(performance.now()-this.t0);this.phase='done';this.fault=null;this.win=p;this.ms=ms;this.msg=null;addWin(p)}
  else return;$('#pads').classList.remove('go');this.refresh()},
 key(e){if(e.repeat)return;const k=e.key.toLowerCase();if(k==='a')this.hit(0);else if(k==='l')this.hit(1)},
 stop(){clearTimeout(this.t)},
 refresh(){document.querySelectorAll('.pn').forEach((s,i)=>s.innerHTML=who(i));
  let m=this.msg;if(m===null)m=this.fault!=null?who(this.fault)+' jumped the gun. '+who(1-this.fault)+' wins!':who(this.win)+' wins with '+this.ms+' ms!';
  $('#st').innerHTML=m;$('#go').textContent=this.phase==='done'?'Next round':'Start round';$('#go').disabled=this.phase==='wait'||this.phase==='go'}
};

const rps={
 mount(){this.pick=[null,null];this.phase='play';const C=['Rock','Paper','Scissors'];
  stage.innerHTML='<p class="status" id="st" aria-live="polite"></p><div class="pads" id="pads">'+[0,1].map(p=>'<div class="col"><div class="pn2"><span class="pn"></span></div>'+C.map((c,k)=>`<button class="pad p${p+1} sm" data-p="${p}" data-k="${k}">${c}</button>`).join('')+'</div>').join('')+'</div><p class="rules">Pick in secret. Keys: Q W E and I O P.</p>';
  $('#pads').onclick=e=>{const b=e.target.closest('.pad');if(b)this.choose(+b.dataset.p,+b.dataset.k)};this.refresh()},
 choose(p,k){if(this.phase!=='play'||this.pick[p]!==null)return;this.pick[p]=k;
  document.querySelectorAll(`.pad[data-p="${p}"]`).forEach(b=>b.disabled=true);
  if(this.pick.every(x=>x!==null)){const d=(this.pick[0]-this.pick[1]+3)%3;
   document.querySelectorAll('.pad').forEach(b=>{if(+b.dataset.k===this.pick[+b.dataset.p])b.classList.add('sel')});
   if(d){this.phase='done';this.win=d===1?0:1;addWin(this.win)}else{this.phase='tie';this.t=setTimeout(()=>this.mount(),1800)}}
  this.refresh()},
 key(e){const i='qweiop'.indexOf(e.key.toLowerCase());if(i>=0)this.choose(i<3?0:1,i%3)},
 stop(){clearTimeout(this.t)},
 refresh(){document.querySelectorAll('.pn').forEach((s,i)=>s.innerHTML=who(i));const C=['Rock','Paper','Scissors'],p=this.pick;
  $('#st').innerHTML=this.phase==='done'?who(this.win)+' wins: '+C[p[this.win]]+' beats '+C[p[1-this.win]]+'!':this.phase==='tie'?'Both picked '+C[p[0]]+'. Throw again!':p[0]!==null?who(0)+' is locked in. Waiting for '+who(1)+'.':p[1]!==null?who(1)+' is locked in. Waiting for '+who(0)+'.':'Pick your move in secret.'}
};
const mash={
 mount(){this.c=[0,0];this.phase='wait';this.msg='Get ready…';
  stage.innerHTML='<p class="status" id="st" aria-live="polite"></p><div class="pads" id="pads">'+[0,1].map(p=>`<button class="pad p${p+1}" data-p="${p}"><span class="pn"></span><span class="cnt" id="m${p}">0</span><small>click or press</small></button>`).join('')+'</div><p class="rules">First to 25 taps wins. Taps before green don’t count.</p>';
  $('#pads').onclick=e=>{const b=e.target.closest('.pad');if(b)this.tap(+b.dataset.p)};this.refresh()},
 start(){clearTimeout(this.t);this.phase='wait';this.msg='Get ready…';this.t=setTimeout(()=>{this.phase='go';this.msg='Mash!';$('#pads').classList.add('go');this.refresh()},1500+Math.random()*2000);this.refresh()},
 tap(p){if(this.phase!=='go')return;$('#m'+p).textContent=++this.c[p];if(this.c[p]>=25){this.phase='done';this.win=p;$('#pads').classList.remove('go');addWin(p)}this.refresh()},
 key(e){if(e.repeat)return;const k=e.key.toLowerCase();if(k==='a')this.tap(0);else if(k==='l')this.tap(1)},
 stop(){clearTimeout(this.t)},
 refresh(){document.querySelectorAll('.pn').forEach((s,i)=>s.innerHTML=who(i));$('#st').innerHTML=this.phase==='done'?who(this.win)+' wins the race!':this.msg}
};
const math={
 mount(){const a=2+Math.floor(Math.random()*11),b=2+Math.floor(Math.random()*11),o=Math.floor(Math.random()*3);
  const[x,y]=a<b&&o===2?[b,a]:[a,b];this.q=x+' '+['+','×','−'][o]+' '+y;this.ans=[x+y,x*y,x-y][o];
  const s=new Set([this.ans]);while(s.size<3)s.add(this.ans+(Math.random()<.5?-1:1)*(1+Math.floor(Math.random()*4)));
  this.opts=[...s].sort(()=>Math.random()-.5);this.phase='wait';
  stage.innerHTML='<p class="status" id="st" aria-live="polite"></p><div class="q" id="q">?</div><div class="pads" id="pads">'+[0,1].map(p=>'<div class="col"><div class="pn2"><span class="pn"></span></div>'+[0,1,2].map(k=>`<button class="pad p${p+1} sm" data-p="${p}" data-k="${k}" disabled>–</button>`).join('')+'</div>').join('')+'</div><p class="rules">First to tap the right answer wins. A wrong tap loses. Keys: A S D and J K L.</p>';
  $('#pads').onclick=e=>{const b=e.target.closest('.pad');if(b)this.hit(+b.dataset.p,+b.dataset.k)};this.refresh()},
 start(){this.phase='wait';this.t=setTimeout(()=>{this.phase='go';$('#q').textContent=this.q+' = ?';document.querySelectorAll('.pad').forEach(b=>{b.disabled=false;b.textContent=this.opts[+b.dataset.k]});$('#pads').classList.add('go');this.refresh()},1200+Math.random()*1500);this.refresh()},
 hit(p,k){if(this.phase!=='go')return;const ok=this.opts[k]===this.ans;this.phase='done';this.win=ok?p:1-p;this.bad=ok?null:p;
  document.querySelectorAll('.pad').forEach(b=>{b.disabled=true;if(this.opts[+b.dataset.k]===this.ans)b.classList.add('sel')});$('#pads').classList.remove('go');addWin(this.win);this.refresh()},
 key(e){if(e.repeat)return;const i='asdjkl'.indexOf(e.key.toLowerCase());if(i>=0)this.hit(i<3?0:1,i%3)},
 stop(){clearTimeout(this.t)},
 refresh(){document.querySelectorAll('.pn').forEach((s,i)=>s.innerHTML=who(i));$('#st').innerHTML=this.phase==='done'?(this.bad!==null?who(this.bad)+' guessed wrong. ':'')+who(this.win)+' wins!':this.phase==='go'?'Solve it!':'Get ready…'}
